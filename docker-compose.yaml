services:
  app:
    build:
      context: .
      args:
        - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "3000:3000"
    restart: unless-stopped

  db:
    image: mariadb:11.8.3
    env_file:
      - .env
    environment:
      - MARIADB_USER=${DB_USER}
      - MARIADB_PASSWORD=${DB_PASS}
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASS}
      - MARIADB_DATABASE=${DB_NAME}
    ports:
      - "${DB_PORT}:3306"
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data: